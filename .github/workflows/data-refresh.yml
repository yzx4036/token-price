name: 数据定时刷新

# 只做「抓取 → 校验 → 提交」，不碰官方价格（那部分必须人工核对）。
# 汇率每天抓一次；聚合快照每周重抓一次。
#
# 两个必须知道的 Actions 行为（已核对官方文档）：
# 1) 用仓库自带的 GITHUB_TOKEN 推送代码，**不会再触发** push 事件的工作流，
#    所以本文件的校验步骤必须自己跑一遍，不能指望 ci.yml 兜底。
# 2) 公开仓的定时工作流在 60 天无活动后会被自动停用；本仓是私有仓，不受这条约束。
#
# 选在这些分钟数是有意的：GitHub 文档建议避开整点（整点排队最挤，可能延迟或丢跑）。
on:
  schedule:
    - cron: '17 3 * * *'      # 每天 03:17 UTC（北京 11:17）—— 只更新汇率
    - cron: '23 3 * * 1'      # 每周一 03:23 UTC —— 汇率 + 聚合快照
  workflow_dispatch:
    inputs:
      pull_aggregate:
        description: 同时重抓聚合快照
        type: boolean
        default: true
      force_deploy:
        description: 即使数据没变化也发布一次站点（验证发布链路用）
        type: boolean
        default: false

permissions:
  contents: write
  # 失败告警要能开 / 关 issue。定时任务挂掉时没人看 Actions 页面，
  # 只有 issue 会被 GitHub 邮件推到人眼前。
  issues: write

# 定时任务偶发重叠时不要并发写同一份数据
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # 可选：配了它才会顺带把产物发布到站点仓（默认 GITHUB_TOKEN 无法推别的仓）
      SITE_PUSH_TOKEN: ${{ secrets.SITE_PUSH_TOKEN }}
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          ref: master

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 确定本次要做什么
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PULL="${{ github.event.inputs.pull_aggregate }}"
          elif [ "${{ github.event.schedule }}" = "23 3 * * 1" ]; then
            PULL="true"
          else
            PULL="false"
          fi
          echo "抓聚合快照：$PULL"
          echo "pull=$PULL" >> "$GITHUB_OUTPUT"

      - name: 更新汇率
        run: node scripts/data/cli.mjs rate

      - name: 更新聚合快照
        if: steps.plan.outputs.pull == 'true'
        run: node scripts/data/cli.mjs pull

      - name: 重建派生数据（折算量 / 智能基准）
        # 这两个产物是「依据 + 价格表」算出来的，不是手写：
        #   token-estimates = plans.json + estimates/token-basis.json
        #   benchmarks      = api.json   + estimates/benchmark-basis.json
        # 抓过聚合快照后 api.json 会变动，派生数据就可能过期 —— 必须先重算再判 diff，
        # 否则产物与依据脱节、线上还显示旧的折算量。
        #
        # ⚠️ 这一步只重算「由已核验依据推导出的值」，不碰任何官方价格与依据本身。
        run: |
          node scripts/data/gen-token-estimates.mjs
          node scripts/data/gen-benchmarks.mjs

      - name: 数据校验
        # 先校验再快照，历史变化也参与后续 diff 判定。
        run: |
          node scripts/data/cli.mjs verify
          # 派生数据必须与重算结果一致（重算一次再比，不等就算不一致）
          node scripts/data/gen-token-estimates.mjs --check
          node scripts/data/gen-benchmarks.mjs --check

      - name: 官方价格历史快照（失败只告警）
        run: |
          node scripts/data/history.mjs snapshot || {
            echo "::warning::快照失败（不阻断数据刷新）"
            echo "快照失败（不阻断数据刷新）" >> "$GITHUB_STEP_SUMMARY"
          }

      - name: 判断数据是否有实质变化
        id: diff
        run: |
          # 抓取时间 fetchedAt 每次都变，只看它不算实质变化，否则每天都会为一行时间戳提交。
          # 但不能靠白名单字段名判断——实测漏过 "models" 这类子字段的变化，
          # 所以改成「排除 fetchedAt 行后还有任何改动」才算有变化。
          CHANGED="$(git diff -U0 -- src/data | grep -E '^[+-][^+-]' | grep -v 'fetchedAt' || true)"
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "有实质变化："
            echo "$CHANGED" | head -20
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "只有抓取时间变化，跳过提交"
          fi

      - name: 差异报告（只打印，不阻断）
        # 只在本次抓过聚合快照时跑：快照是被 gitignore 的本地缓存，CI 上只有 pull 之后才存在
        if: steps.diff.outputs.changed == 'true' && steps.plan.outputs.pull == 'true'
        run: node scripts/data/cli.mjs drift || true

      - name: 候选发现（只报告，不落库）
        # 每周抓过快照时顺带跑一次：把「没收录的厂商」和「被上限挤掉的模型」列进 run 摘要，
        # 让人一眼看到该不该补数据。这一步不写任何文件，收录仍需人工核验官方页。
        if: steps.plan.outputs.pull == 'true'
        run: |
          {
            echo "### 聚合源候选发现"
            echo ""
            echo '```'
            node scripts/data/cli.mjs discover --top 12 || echo "discover 执行失败（不阻断数据刷新）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 订阅套餐价格漂移（只告警，不改数据）
        # 每周查一次：当初录入的月费是否还出现在官方页上。
        # 这是唯一会碰订阅套餐的自动步骤——只读、不改价、不提交，改价仍人工确认。
        if: steps.plan.outputs.pull == 'true'
        run: |
          {
            echo "### 订阅套餐价格漂移"
            echo ""
            echo '```'
            node scripts/data/cli.mjs plans-drift || echo "plans-drift 执行失败（不阻断数据刷新）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 套餐结构与额度漂移（只告警，不改数据）
        if: steps.plan.outputs.pull == 'true'
        run: |
          {
            echo "### 套餐结构与额度漂移"
            echo ""
            echo '```'
            node scripts/data/cli.mjs plans-structure-drift || echo "plans-structure-drift 执行失败（不阻断数据刷新）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 套餐档位发现（候选清单，只读）
        # 与上面那条「结构漂移」的区别：那个只看全页价格集合，会被 token 单价淹掉；
        # 这里先按月费语境归类，再出「新增档位 / 疑似下架」候选。仍然只报告、不写数据。
        if: steps.plan.outputs.pull == 'true'
        run: |
          {
            echo "### 套餐档位发现（候选清单）"
            echo ""
            echo '```'
            node scripts/data/cli.mjs plans-tier-discovery || echo "plans-tier-discovery 执行失败（不阻断数据刷新）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 官方 API 价格页漂移（只告警，不改数据）
        if: steps.plan.outputs.pull == 'true'
        run: |
          {
            echo "### 官方 API 价格页漂移"
            echo ""
            echo '```'
            node scripts/data/cli.mjs official-price-drift || echo "official-price-drift 执行失败（不阻断数据刷新）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提交并推送
        # 强制发布时也要提交：构建产物里嵌了汇率的 fetchedAt，
        # 只发不提交会让线上显示一个仓库里查不到的抓取时间，破坏溯源一致性。
        if: steps.diff.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          if git diff --cached --quiet; then
            echo "数据无 diff，跳过提交"
          else
            git commit -q -m "chore: 定时刷新汇率与聚合数据（$(date -u +%Y-%m-%d)）"
            git push origin HEAD:master
          fi

      - name: 发布到站点仓
        # 没有配 SITE_PUSH_TOKEN 就跳过：跨仓推送需要 PAT 或 deploy key，
        # 仓库自带的 GITHUB_TOKEN 只对本仓有效。
        # force_deploy 用于「数据没变但想重发一次」（例如改了构建或页面），也用来验证发布链路。
        if: >-
          env.SITE_PUSH_TOKEN != '' &&
          (steps.diff.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SITE_REMOTE="https://x-access-token:${SITE_PUSH_TOKEN}@github.com/yzx4036/yzx4036.github.io.git" \
            bash scripts/deploy-site.sh

      - name: 汇总
        run: |
          {
            echo "### 数据定时刷新"
            echo ""
            echo "| 项 | 结果 |"
            echo "|---|---|"
            echo "| 抓聚合快照 | ${{ steps.plan.outputs.pull }} |"
            echo "| 有实质变化 | ${{ steps.diff.outputs.changed }} |"
            echo "| 自动发布 | ${{ env.SITE_PUSH_TOKEN != '' && (steps.diff.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true') && '是' || '否' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- 失败可见化 ----------
      # 背景：2026-11-01 的定时刷新因为一个写死汇率的断言挂掉，连续失败 3 小时无人发现，
      # 线上一直挂着昨天的汇率。Actions 失败默认只发邮件且容易被忽略，
      # 所以改成「开 issue」——issue 会被 assignee 邮件推一次，也能在仓库首页看见。
      #
      # 用 if: failure() 而不是 if: always()：只在前面真挂时开，正常失败不会误报。
      - name: 失败告警（开 issue）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="数据定时刷新失败（需要人工处理）"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY=$(printf '定时刷新在 %s 失败。\n\n- 触发方式：%s\n- 运行记录：%s\n\n**这是自动开的告警，修好后本工作流下一次成功会自动关闭它。**\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ github.event_name }}" \
            "$RUN_URL")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "又失败了一次：$RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: 恢复后关闭告警
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="数据定时刷新失败（需要人工处理）"
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "已恢复：本次刷新成功，自动关闭。"
            gh issue close "$EXISTING"
          fi
